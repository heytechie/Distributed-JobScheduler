services:
  db:
    image: postgres:16-alpine
    container_name: job_orchestrator_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_orchestrator
    ports:
      - "5433:5432"
  service:
    build: .
    container_name: job_orchestrator_service
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: job_orchestrator
    ports:
      - "3000:3000"